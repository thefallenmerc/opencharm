name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen
      - name: Unit tests
        run: make test
        env: { CI: "true" }
      - name: Build app
        run: make build
